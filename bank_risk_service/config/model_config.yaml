# =============================================================================
# Model & scoring configuration. All ML models read parameters from here so they
# are reproducible (fixed random_state) and tunable without code changes.
# =============================================================================

random_state: 42

preprocessing:
  winsorize_quantiles: [0.01, 0.99]   # outlier capping before scaling
  scaler: standard                    # standard | robust | minmax
  min_non_null_ratio: 0.30            # drop features sparser than this
  impute_strategy: median

isolation_forest:
  n_estimators: 300
  contamination: 0.08                 # expected anomaly fraction (tunable)
  max_samples: auto
  bootstrap: false
  top_features: 6                     # n contributing features to explain anomalies

kmeans:
  k_min: 2
  k_max: 10
  k_selection: silhouette             # silhouette | davies_bouldin | calinski_harabasz | manual
  manual_k: 4
  n_init: 10
  max_iter: 300

time_series:
  rolling_window: 4                   # periods for rolling mean/std/z-score
  zscore_alert: 2.5                   # |rolling z| above this is flagged
  high_risk_period:
    min_anomaly_rate: 0.20            # share of banks anomalous in a period
    min_critical_banks: 2            # banks with CRITICAL rules in a period
    systemic_stress_pct: 0.75        # percentile of stress index to flag

# ---- Risk scoring weights (final_risk_score = max(rule_floor, weighted)) ----
risk_scoring:
  weights:
    rule_violation_score: 0.35
    anomaly_score_norm: 0.25
    trend_risk_score: 0.15
    cluster_risk_score: 0.10
    data_quality_risk_score: 0.10
    systemic_period_risk_score: 0.05
  rule_floor:                         # min final score forced by worst rule severity
    CRITICAL: 90
    HIGH: 75
    MEDIUM: 50
    LOW: 25
    DATA_GAP: 70
  risk_levels:                        # final_risk_score -> level
    - {le: 25, level: LOW}
    - {le: 50, level: MEDIUM}
    - {le: 75, level: HIGH}
    - {gt: 75, level: CRITICAL}
  # severity contribution to rule_violation_score (0..100), max over a bank-period
  severity_points:
    INFO: 10
    LOW: 25
    MEDIUM: 50
    HIGH: 75
    CRITICAL: 100
    DATA_GAP: 70

# ---- Multi-frequency integration ("combined" view) ----
# Build a monthly-grain table enriched with as-of (point-in-time) values from the
# coarser frequencies. `tolerance_days` = how long a coarser value may be carried
# forward before it is considered stale (no value rather than a stale one).
multi_frequency:
  enabled: true
  tolerance_days:
    quarterly: 130     # ~ a quarter + reporting lag
    yearly: 430        # ~ a year + reporting lag

versions:
  model_version: "1.1.0"
  config_version: "1.1.0"

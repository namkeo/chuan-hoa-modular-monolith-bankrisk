# =============================================================================
# Early Warning System (EWS) configuration — cảnh báo sớm rủi ro an toàn hoạt động
# hệ thống ngân hàng. Khác với rule_engine (kiểm tra vi phạm hiện tại) và
# risk_scoring (trạng thái rủi ro tức thời), EWS dùng các CHỈ BÁO DẪN DẮT (leading):
#   - khoảng cách tới ngưỡng (proximity-to-limit)  -> cảnh báo TRƯỚC khi vi phạm
#   - xu hướng / đà xấu đi (trend, acceleration)
#   - biến động (volatility spike)
#   - chuỗi kỳ liên tiếp tiệm cận/vượt ngưỡng mềm (breach streak)
#   - bất thường lặp lại (anomaly persistence)
#   - dự phóng số kỳ tới khi chạm ngưỡng (projected periods to breach)
#
# Tần suất khuyến nghị: THÁNG (monthly) — dữ liệu tháng phủ tốt CAR, LDR, tỷ lệ vốn
# ngắn hạn cho vay TDH và có chuỗi đủ dài để ước lượng xu hướng.
#
# Mọi ngưỡng pháp lý tham chiếu Thông tư 22/2019/TT-NHNN & VBHN; KTV cần đối chiếu
# văn bản gốc. EWS là công cụ cảnh báo sớm, KHÔNG khẳng định vi phạm/đổ vỡ.
# =============================================================================

default_frequency: monthly
lookback: 6            # số kỳ dùng tính slope/volatility/streak
projection_horizon: 12 # giới hạn kỳ khi dự phóng "số kỳ tới khi chạm ngưỡng"
min_points: 3          # số điểm tối thiểu để ước lượng xu hướng

# Bộ chỉ tiêu an toàn theo dõi. direction:
#   higher_safer -> vi phạm khi giá trị THẤP (ví dụ CAR, dự trữ thanh khoản)
#   lower_safer  -> vi phạm khi giá trị CAO (ví dụ LDR, NPL, vốn NH cho vay TDH)
# buffer = vùng đệm cảnh báo sớm phía trước ngưỡng (cùng đơn vị %).
metrics:
  - name: car_solo
    label: "CAR riêng lẻ"
    direction: higher_safer
    limit: 8.0
    buffer: 1.5            # 8.0–9.5 = vùng cảnh báo sớm
    domain: capital
    weight: 1.3
    plausible: [1.0, 50.0]   # ngoài khoảng -> coi như thiếu dữ liệu (data gap)
  - name: car_consolidated
    label: "CAR hợp nhất"
    direction: higher_safer
    limit: 8.0
    buffer: 1.5
    domain: capital
    weight: 1.1
    plausible: [1.0, 50.0]   # ngoài khoảng -> coi như thiếu dữ liệu (data gap)
  - name: ldr
    label: "LDR"
    direction: lower_safer
    limit: 85.0
    buffer: 5.0            # 80–85 = vùng cảnh báo sớm
    domain: liquidity
    weight: 1.1
    plausible: [5.0, 200.0]   # ngoài khoảng -> coi như thiếu dữ liệu (data gap)
  - name: st_funding_for_mlt_loans
    label: "Vốn ngắn hạn cho vay TDH"
    direction: lower_safer
    limit: 30.0
    buffer: 4.0            # 26–30
    domain: liquidity
    weight: 1.0
    plausible: [0.0, 100.0]   # ngoài khoảng -> coi như thiếu dữ liệu (data gap)
  - name: liquidity_reserve_ratio
    label: "Dự trữ thanh khoản"
    direction: higher_safer
    limit: 10.0
    buffer: 3.0
    domain: liquidity
    weight: 1.0
    plausible: [0.0, 100.0]   # ngoài khoảng -> coi như thiếu dữ liệu (data gap)
  - name: solvency_30d_vnd
    label: "Khả năng chi trả 30 ngày"
    direction: higher_safer
    limit: 50.0
    buffer: 10.0
    domain: liquidity
    weight: 0.8
    plausible: [0.0, 600.0]   # ngoài khoảng -> coi như thiếu dữ liệu (data gap)
  - name: npl_ratio
    label: "Tỷ lệ nợ xấu"
    direction: lower_safer
    limit: 3.0
    buffer: 1.0            # 2–3 = chú ý
    domain: credit
    weight: 1.1
    plausible: [0.0, 60.0]   # ngoài khoảng -> coi như thiếu dữ liệu (data gap)
  - name: group2_ratio
    label: "Nợ nhóm 2"
    direction: lower_safer
    limit: 5.0
    buffer: 2.0
    domain: credit
    weight: 0.7
    plausible: [0.0, 60.0]   # ngoài khoảng -> coi như thiếu dữ liệu (data gap)
  - name: llr_coverage
    label: "Bao phủ nợ xấu"
    direction: higher_safer
    limit: 50.0
    buffer: 20.0
    domain: credit
    weight: 0.6
    plausible: [0.0, 500.0]   # ngoài khoảng -> coi như thiếu dữ liệu (data gap)
  - name: roa
    label: "ROA"
    direction: higher_safer
    limit: 0.0            # thua lỗ
    buffer: 0.5
    domain: profitability
    weight: 0.5
    plausible: [-30.0, 30.0]   # ngoài khoảng -> coi như thiếu dữ liệu (data gap)

# Trọng số tổ hợp các tín hiệu thành ews_score (0..100).
signal_weights:
  proximity: 0.30          # tiệm cận ngưỡng
  trend: 0.24              # đà xấu đi
  acceleration: 0.10       # gia tốc xấu đi
  volatility: 0.10         # biến động tăng
  breach_streak: 0.16      # liên tiếp tiệm cận/vượt ngưỡng mềm
  anomaly_persistence: 0.10 # bất thường lặp lại

# Ngưỡng phân mức EWS (traffic-light).
levels:
  - {le: 25, level: NORMAL,  label: "Bình thường"}
  - {le: 50, level: WATCH,   label: "Theo dõi"}
  - {le: 75, level: WARNING, label: "Cảnh báo"}
  - {gt: 75, level: ALARM,   label: "Báo động"}

# Quy tắc nâng mức tối thiểu (escalation) khi tín hiệu cứng xuất hiện.
escalation:
  near_limit_min_level: WATCH      # đang trong vùng đệm cảnh báo -> ít nhất Theo dõi
  breached_min_level: WARNING      # đã vượt ngưỡng -> ít nhất Cảnh báo
  breached_worsening_min_level: ALARM  # đã vượt ngưỡng VÀ còn xấu đi -> Báo động
  projected_breach_periods: 3      # dự phóng chạm ngưỡng <= 3 kỳ -> ít nhất Cảnh báo

# Tham số EWS cấp hệ thống.
system:
  warn_share_warning: 0.20         # >=20% NH ở WARNING+ -> hệ thống "Cảnh báo"
  warn_share_alarm: 0.30           # >=30% NH ở WARNING+ -> hệ thống "Báo động"

# Watchlist "rủi ro mới nổi": NH có điểm EWS tăng nhanh hoặc mức bị nâng.
emerging:
  score_jump: 12                   # tăng >=12 điểm so với kỳ trước

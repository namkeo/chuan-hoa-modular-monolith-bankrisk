# =============================================================================
# Phân loại loại hình TCTD  ->  quyết định BỘ NGƯỠNG GIÁM SÁT được áp dụng
#
# Ngưỡng giám sát của NHNN (QĐ 682/QĐ-TTGSNH4 và QĐ 618/QĐ-TTGSNH3) KHÁC NHAU
# theo loại hình TCTD. File này ánh xạ từng đơn vị trong dữ liệu sang loại hình
# tương ứng; src/rule_engine.py dùng nó để chọn đúng ngưỡng trong
# config/supervisory_thresholds.yaml.
#
# ⚠️ KTV PHẢI RÀ SOÁT FILE NÀY. Phân loại sai => áp sai ngưỡng => sai cờ CRITICAL.
# Các đơn vị có `review: true` là trường hợp Claude KHÔNG chắc chắn — cần xác nhận.
#
# Lưu ý mức độ ảnh hưởng: với Ngưỡng 3 (mức vi phạm tuân thủ), `nhtm_nha_nuoc` và
# `nhtm_co_phan` có ngưỡng GIỐNG HỆT nhau (khác biệt chỉ ở Ngưỡng 1/2 - cảnh báo
# sớm). Tương tự, `cong_ty_tai_chinh` và `cong_ty_cho_thue_tai_chinh` chỉ khác
# nhau ở ngưỡng trái phiếu Chính phủ. Nhầm lẫn trong cùng nhóm này ít rủi ro hơn
# nhầm giữa "ngân hàng" và "công ty tài chính".
# =============================================================================

meta:
  legal_source: >
    QĐ 682/QĐ-TTGSNH4 ngày 30/10/2024 (TCTD, chi nhánh NH nước ngoài);
    QĐ 618/QĐ-TTGSNH3 ngày 07/09/2024 (tổ chức tài chính vi mô).
  reviewed_by: null          # KTV điền tên sau khi rà soát
  reviewed_at: null          # ngày rà soát
  status: DRAFT_REVIEW_REQUIRED

# Tên hiển thị của từng loại hình (khớp với các dòng "Đối tượng áp dụng" trong QĐ).
type_labels:
  nhtm_nha_nuoc: "NH thương mại nhà nước"
  nhtm_co_phan: "NH thương mại cổ phần"
  nh_lien_doanh: "NH liên doanh"
  nh_100_von_ngoai: "NH 100% vốn nước ngoài"
  cn_nh_nuoc_ngoai: "Chi nhánh NH nước ngoài"
  cong_ty_tai_chinh: "Công ty tài chính"
  cong_ty_cho_thue_tai_chinh: "Công ty cho thuê tài chính"
  tctcvm_tinh_thuong: "TCTCVM Tình Thương (TYM)"
  tctcvm_lao_dong_ngheo: "TCTCVM lao động nghèo tự tạo việc làm"
  tctcvm_m7: "TCTCVM M7"
  tctcvm_thanh_hoa: "TCTCVM Thanh Hóa"
  khong_thuoc_pham_vi: "Không thuộc phạm vi QĐ 682/618"

# -----------------------------------------------------------------------------
# Đơn vị KHÔNG áp ngưỡng giám sát.
# Căn cứ QĐ 682 Phụ lục 3, mục 3.2: "Đối tượng giám sát đang bị kiểm soát đặc
# biệt, can thiệp sớm hoặc giám sát tăng cường. Cán bộ giám sát thực hiện theo
# quy định pháp luật liên quan hiện hành mà KHÔNG sử dụng ngưỡng."
# Rule engine sinh finding loại SPECIAL_CONTROL (không phải VIOLATION) để KTV
# biết rõ vì sao đơn vị này không có cờ vi phạm — tránh hiểu nhầm là "tuân thủ".
# -----------------------------------------------------------------------------
special_control:
  - bank_id: SCB
    reason: "Kiểm soát đặc biệt từ 15/10/2022."
    review: true
  - bank_id: VCBNEO
    reason: "NH Xây dựng (CB) — chuyển giao bắt buộc về Vietcombank 17/10/2024; trước đó thuộc diện kiểm soát đặc biệt."
    review: true
  - bank_id: MBV
    reason: "OceanBank — chuyển giao bắt buộc về MB 17/10/2024; trước đó thuộc diện kiểm soát đặc biệt."
    review: true
  - bank_id: GPBANK
    reason: "GPBank — chuyển giao bắt buộc về VPBank 17/01/2025; trước đó thuộc diện kiểm soát đặc biệt."
    review: true
  - bank_id: VIKKI
    reason: "DongA Bank — chuyển giao bắt buộc về HDBank 17/01/2025; trước đó thuộc diện kiểm soát đặc biệt."
    review: true

# -----------------------------------------------------------------------------

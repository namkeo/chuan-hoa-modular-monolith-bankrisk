  # phần chi phối — trong thống kê giám sát của NHNN thường xếp nhóm "NHTM Nhà
  # nước". KTV xác nhận cách xếp nhóm đang dùng. (Chỉ ảnh hưởng Ngưỡng 1/2.)
  AGRIBANK: { type: nhtm_nha_nuoc }
  VIETCOMBANK: { type: nhtm_nha_nuoc, review: true }
  VIETINBANK: { type: nhtm_nha_nuoc, review: true }

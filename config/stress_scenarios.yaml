# =============================================================================
# Stress-test scenarios — kiểm tra sức chịu đựng vốn & thanh khoản của hệ thống
# ngân hàng trước các kịch bản khủng hoảng giả định.
#
# Hai trục đo:
#   VỐN (capital): sốc tín dụng (NPL tăng) + tăng RWA -> tổn thất ăn mòn vốn tự có
#                  -> CAR sau sốc, mức thiếu hụt vốn so với ngưỡng 8%, "điểm gãy" NPL.
#   THANH KHOẢN (liquidity): rút tiền gửi hàng loạt + rút vốn bán buôn + haircut HQLA
#                  -> tỷ lệ bao phủ thanh khoản (LCR) hoặc LDR sau sốc, khe hở thanh khoản.
#
# Dữ liệu thiếu (vd HQLA, RWA) được suy luận khi có thể, hoặc gắn DATA_GAP.
# Tần suất khuyến nghị: THÁNG (có CAR/RWA/vốn tự có và tiền gửi/dư nợ).
#
# Đây là phân tích kịch bản giả định hỗ trợ kiểm toán — KHÔNG phải dự báo, các giả
# định (LGD, run-off…) phải được KTV xem xét phù hợp bối cảnh.
# =============================================================================

default_frequency: monthly

capital:
  min_car: 8.0            # ngưỡng CAR tối thiểu (TT41/2016, VBHN 02)
  tier1_min: 6.0          # ngưỡng vốn cấp 1 (tham chiếu)

liquidity:
  use_hqla_if_available: true
  lcr_min: 100.0          # LCR tối thiểu (chuẩn Basel/tham chiếu)
  stressed_ldr_limit: 100.0  # khi không có HQLA: LDR sau sốc > mức này -> không đạt

# Giả định mặc định (scenario có thể ghi đè).
assumptions:
  lgd: 0.55               # loss-given-default trên nợ xấu phát sinh thêm
  tax_shield: 0.0         # 0 = ghi nhận toàn bộ tổn thất vào vốn (thận trọng)

# Danh sách kịch bản. Tham số:
#   npl_shock_pp   : NPL ratio tăng thêm (điểm %)
#   rwa_shock      : RWA tăng (tỷ lệ, vd 0.05 = +5%)
#   lgd            : tỷ lệ tổn thất trên nợ xấu mới
#   deposit_runoff : tỷ lệ rút tiền gửi khách hàng
#   wholesale_runoff: tỷ lệ rút vốn liên ngân hàng/bán buôn
#   hqla_haircut   : chiết khấu giá trị tài sản thanh khoản cao
scenarios:
  - id: baseline
    name: "Cơ sở"
    description: "Điều kiện vĩ mô ổn định, sốc nhẹ."
    npl_shock_pp: 1.0
    rwa_shock: 0.02
    lgd: 0.45
    deposit_runoff: 0.05
    wholesale_runoff: 0.10
    hqla_haircut: 0.05

  - id: adverse
    name: "Bất lợi"
    description: "Suy giảm kinh tế, nợ xấu tăng, thanh khoản căng."
    npl_shock_pp: 3.0
    rwa_shock: 0.05
    lgd: 0.55
    deposit_runoff: 0.10
    wholesale_runoff: 0.25
    hqla_haircut: 0.10

  - id: severe
    name: "Nghiêm trọng (khủng hoảng)"
    description: "Khủng hoảng tài chính, nợ xấu tăng mạnh, rút tiền diện rộng."
    npl_shock_pp: 6.0
    rwa_shock: 0.10
    lgd: 0.65
    deposit_runoff: 0.20
    wholesale_runoff: 0.40
    hqla_haircut: 0.20

  - id: credit_crisis
    name: "Sốc tín dụng cực đoan"
    description: "Tập trung sốc chất lượng tài sản (NPL +10 điểm %)."
    npl_shock_pp: 10.0
    rwa_shock: 0.08
    lgd: 0.70
    deposit_runoff: 0.05
    wholesale_runoff: 0.10
    hqla_haircut: 0.05

  - id: liquidity_run
    name: "Rút tiền hàng loạt (bank run)"
    description: "Tập trung sốc thanh khoản: rút 30% tiền gửi, 60% vốn bán buôn."
    npl_shock_pp: 1.0
    rwa_shock: 0.0
    lgd: 0.45
    deposit_runoff: 0.30
    wholesale_runoff: 0.60
    hqla_haircut: 0.25
